; APIXON Netzwerk-Konfiguration -> auf das Geraet nach /data/ethernet.ini
; Format/Schluessel: LOGIBUS_integration_datapanel/Application/components/Network_Ethernet_ini/config.def
; Bool-Werte als 0/1 (Firmware parst mit atoi). Wirksam nach Neustart.
;
; Feste IP 192.168.1.11 (= MGR_ID "APIXON" in FU_Demo_Konstanten.gcf und
; Dashboard-Default ws://192.168.1.11:4841). Waveshare-Gateway: 192.168.1.200.

[ETH_INT]
IP_ADDR = 192.168.1.11
GATEWAY = 192.168.1.1
NETMASK = 255.255.255.0
DHCP_CLIENT = 0
MAIN_DNS_SERVER = 192.168.1.1
BACKUP_DNS_SERVER = 0.0.0.0
FALLBACK_DNS_SERVER = 0.0.0.0
hostname = apixon-fu-demo
SNTP_SYNC = 0
SNTP_SERVER_0 = pool.ntp.org
TZ = CET-1CEST,M3.5.0,M10.5.0/3
